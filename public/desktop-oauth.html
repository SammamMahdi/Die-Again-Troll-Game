<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Die Again — Desktop Sign-in</title>
  <!-- Standalone relay page: deployed to the same Vercel host as the
       web build. The desktop .exe opens this URL in the system browser
       to complete a Google sign-in. After auth, this page builds a
       dieagain://auth?id_token=... URL and shows it as a clickable link
       so Windows hands the credential back to the running desktop app.

       IMPORTANT: modern browsers (Chrome, Edge, Brave) silently block
       JS-initiated navigation to custom URL schemes — `window.location.href
       = 'dieagain://...'` does nothing on a non-user gesture. So the
       primary path here is a real <a href> the user clicks. We also
       attempt an auto-redirect as a best-effort fallback. -->
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #0a0420;
      color: #e8d9ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 480px;
      padding: 32px 28px;
      text-align: center;
      background: rgba(20, 8, 48, 0.6);
      border: 1px solid rgba(200, 140, 255, 0.35);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(180, 100, 255, 0.25);
    }
    h1 { font-size: 1.4rem; letter-spacing: 4px; color: #ffd966; margin: 0 0 10px; text-shadow: 0 0 10px #ffae3b; }
    p { font-size: 0.95rem; line-height: 1.55; margin: 8px 0; }
    .quiet { color: #b9a4d8; font-size: 0.82rem; }
    .err   { color: #ff7ad0; font-weight: 600; }

    .open-link, button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #ff5cc7 0%, #c47aff 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255, 100, 220, 0.3);
    }
    .open-link:hover, button:hover {
      box-shadow: 0 0 22px rgba(255, 100, 220, 0.7);
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(200, 140, 255, 0.3);
      border-top-color: #ff7ad0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>DIE AGAIN</h1>
    <p id="status"><span class="spinner"></span>Opening Google sign-in…</p>
    <p class="quiet" id="hint">If a popup is blocked, click below to retry.</p>
    <a id="openApp" class="open-link" style="display:none" href="#">Open Die Again →</a>
    <button id="retry" style="display:none">Sign in with Google</button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, getRedirectResult,
      signInWithRedirect,
    } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyC9oOQoE5SLKxCqJEXCMhYrKUpMZm73J2g",
      authDomain:        "die-again-troll-game.firebaseapp.com",
      projectId:         "die-again-troll-game",
      storageBucket:     "die-again-troll-game.firebasestorage.app",
      messagingSenderId: "306765899348",
      appId:             "1:306765899348:web:b5713dbda9401fbd7c2fc1",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const statusEl = document.getElementById('status');
    const hintEl   = document.getElementById('hint');
    const retryEl  = document.getElementById('retry');
    const openEl   = document.getElementById('openApp');

    function bounceToDesktop(idToken) {
      const url = 'dieagain://auth?id_token=' + encodeURIComponent(idToken);

      // Primary path: a real <a href> the user clicks. Modern browsers
      // (Chrome / Edge / Brave) only deliver custom-protocol navigations
      // when triggered by a real user gesture; a JS redirect from a
      // setTimeout silently fails. Showing a big visible button is the
      // ONLY robust way across browsers.
      openEl.href = url;
      openEl.style.display = 'inline-block';

      // Optimistic auto-redirect — works on some browsers (Firefox, older
      // Edge), suppressed on most others. Harmless either way.
      try { window.location.href = url; } catch (_) {}

      statusEl.innerHTML = '<span class="spinner"></span>Returning to Die Again…';
      hintEl.textContent =
        "If the app doesn't open automatically, click the button below. Windows may ask " +
        '"Open Die Again?" — choose "Open" / "Yes".';

      // Once the user clicks the link, we can simplify the message.
      openEl.addEventListener('click', () => {
        statusEl.textContent = 'You can close this tab.';
        hintEl.textContent = '';
      }, { once: true });
    }

    function bounceErrorToDesktop(message) {
      const url = 'dieagain://auth?error=' + encodeURIComponent(message);
      openEl.href = url;
      openEl.textContent = 'Return to Die Again with error →';
      openEl.style.display = 'inline-block';
      try { window.location.href = url; } catch (_) {}
    }

    async function doSignIn() {
      retryEl.style.display = 'none';
      openEl.style.display  = 'none';
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await signInWithPopup(auth, provider);
        const cred = GoogleAuthProvider.credentialFromResult(result);
        if (!cred || !cred.idToken) {
          throw new Error('Sign-in completed but no id_token was returned.');
        }
        bounceToDesktop(cred.idToken);
      } catch (err) {
        if (err && err.code === 'auth/popup-blocked') {
          statusEl.innerHTML = '<span class="spinner"></span>Popup blocked — redirecting instead…';
          try { await signInWithRedirect(auth, new GoogleAuthProvider()); return; }
          catch (e2) {
            statusEl.innerHTML = '<span class="err">Could not start Google sign-in.</span>';
            hintEl.textContent = e2?.message || String(e2);
            retryEl.style.display = 'inline-block';
            return;
          }
        }
        statusEl.innerHTML = '<span class="err">Sign-in failed.</span>';
        hintEl.textContent = err?.message || String(err);
        retryEl.style.display = 'inline-block';
      }
    }

    // If we just came back from a redirect-based sign-in, finish it here.
    (async () => {
      try {
        const res = await getRedirectResult(auth);
        if (res) {
          const cred = GoogleAuthProvider.credentialFromResult(res);
          if (cred && cred.idToken) {
            bounceToDesktop(cred.idToken);
            return;
          }
        }
      } catch (err) {
        // Fall through to fresh sign-in.
      }
      doSignIn();
    })();

    retryEl.addEventListener('click', doSignIn);
  </script>
</body>
</html>
