<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Die Again — Desktop Sign-in</title>
  <!-- Standalone relay page: deployed alongside the main web build.
       The desktop .exe opens this URL in the system browser. The user
       clicks the Google button on this page (so signInWithPopup is in
       a user-gesture context — otherwise modern browsers block it),
       finishes Google auth, then clicks "Open Die Again" so the
       dieagain:// callback fires inside a user gesture too (custom
       protocol navigation also requires user gesture). Two clicks
       total, both unavoidable due to browser security since 2020. -->
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #0a0420;
      color: #e8d9ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 480px;
      padding: 32px 28px;
      text-align: center;
      background: rgba(20, 8, 48, 0.6);
      border: 1px solid rgba(200, 140, 255, 0.35);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(180, 100, 255, 0.25);
    }
    h1 { font-size: 1.4rem; letter-spacing: 4px; color: #ffd966; margin: 0 0 10px; text-shadow: 0 0 10px #ffae3b; }
    p { font-size: 0.95rem; line-height: 1.55; margin: 8px 0; }
    .quiet { color: #b9a4d8; font-size: 0.82rem; }
    .err   { color: #ff7ad0; font-weight: 600; }

    .btn-google, .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 28px;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255, 100, 220, 0.3);
    }
    .btn-google {
      background: #ffffff;
      color: #2c2c2c;
    }
    .btn-google:hover { box-shadow: 0 0 18px rgba(255, 255, 255, 0.5); }
    .btn-google[disabled] { opacity: 0.6; cursor: default; }
    .btn-google svg { width: 20px; height: 20px; }
    .btn-open {
      background: linear-gradient(135deg, #ff5cc7 0%, #c47aff 100%);
      color: #fff;
    }
    .btn-open:hover { box-shadow: 0 0 22px rgba(255, 100, 220, 0.7); }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(200, 140, 255, 0.3);
      border-top-color: #ff7ad0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>DIE AGAIN</h1>
    <p id="status">Sign in with your Google account to continue.</p>
    <p class="quiet" id="hint">Your account is used for the leaderboard and to sync progress across devices.</p>

    <button id="googleBtn" class="btn-google">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285f4" d="M21.6 12.227c0-.709-.063-1.39-.18-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.51h3.23c1.89-1.74 2.983-4.305 2.983-7.351z"/>
        <path fill="#34a853" d="M12 22c2.7 0 4.964-.895 6.617-2.422l-3.23-2.51c-.895.6-2.04.955-3.387.955-2.605 0-4.81-1.76-5.598-4.123H3.077v2.59A9.997 9.997 0 0 0 12 22z"/>
        <path fill="#fbbc04" d="M6.402 13.9a6.005 6.005 0 0 1 0-3.8V7.51H3.077a10.003 10.003 0 0 0 0 8.98l3.325-2.59z"/>
        <path fill="#ea4335" d="M12 5.977c1.468 0 2.786.504 3.823 1.495l2.867-2.867C16.96 2.99 14.696 2 12 2 8.073 2 4.67 4.27 3.077 7.51l3.325 2.59C7.19 7.737 9.395 5.977 12 5.977z"/>
      </svg>
      Sign in with Google
    </button>

    <a id="openApp" class="btn-open" style="display:none" href="#">Open Die Again →</a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
    } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyC9oOQoE5SLKxCqJEXCMhYrKUpMZm73J2g",
      authDomain:        "die-again-troll-game.firebaseapp.com",
      projectId:         "die-again-troll-game",
      storageBucket:     "die-again-troll-game.firebasestorage.app",
      messagingSenderId: "306765899348",
      appId:             "1:306765899348:web:b5713dbda9401fbd7c2fc1",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const statusEl  = document.getElementById('status');
    const hintEl    = document.getElementById('hint');
    const googleBtn = document.getElementById('googleBtn');
    const openEl    = document.getElementById('openApp');

    const GOOGLE_BTN_INNER =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<path fill="#4285f4" d="M21.6 12.227c0-.709-.063-1.39-.18-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.51h3.23c1.89-1.74 2.983-4.305 2.983-7.351z"/>' +
        '<path fill="#34a853" d="M12 22c2.7 0 4.964-.895 6.617-2.422l-3.23-2.51c-.895.6-2.04.955-3.387.955-2.605 0-4.81-1.76-5.598-4.123H3.077v2.59A9.997 9.997 0 0 0 12 22z"/>' +
        '<path fill="#fbbc04" d="M6.402 13.9a6.005 6.005 0 0 1 0-3.8V7.51H3.077a10.003 10.003 0 0 0 0 8.98l3.325-2.59z"/>' +
        '<path fill="#ea4335" d="M12 5.977c1.468 0 2.786.504 3.823 1.495l2.867-2.867C16.96 2.99 14.696 2 12 2 8.073 2 4.67 4.27 3.077 7.51l3.325 2.59C7.19 7.737 9.395 5.977 12 5.977z"/>' +
      '</svg>Sign in with Google';

    function showSignedIn(idToken) {
      const url = 'dieagain://auth?id_token=' + encodeURIComponent(idToken);
      // The user must click the link so Windows accepts the custom-protocol
      // dispatch — JS-initiated navigation to dieagain:// is silently
      // blocked by Chrome / Edge / Brave since v86 (2020).
      openEl.href = url;
      openEl.style.display = 'inline-flex';
      googleBtn.style.display = 'none';
      statusEl.innerHTML = '✓ Signed in. Click below to return to the app.';
      hintEl.textContent = 'Windows may ask "Open Die Again?" — choose Open / Yes.';
      openEl.addEventListener('click', () => {
        statusEl.textContent = 'You can close this tab.';
        hintEl.textContent = '';
      }, { once: true });
    }

    async function doSignIn() {
      googleBtn.disabled = true;
      googleBtn.innerHTML = '<span class="spinner"></span>Opening Google…';
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        // signInWithPopup runs INSIDE the click handler, so the browser
        // sees it as a user-initiated popup and does not block it.
        const result = await signInWithPopup(auth, provider);
        const cred = GoogleAuthProvider.credentialFromResult(result);
        if (!cred || !cred.idToken) {
          throw new Error('Google did not return an ID token.');
        }
        showSignedIn(cred.idToken);
      } catch (err) {
        const code = err?.code || '';
        let msg = err?.message || String(err);
        if (code === 'auth/popup-closed-by-user')    msg = 'You closed the Google popup.';
        if (code === 'auth/popup-blocked')           msg = 'Your browser blocked the popup. Please allow popups for this site.';
        if (code === 'auth/cancelled-popup-request') msg = 'Another sign-in is already running.';
        if (code === 'auth/unauthorized-domain')     msg = 'This domain is not on Firebase\'s authorized list.';
        statusEl.innerHTML = '<span class="err">Sign-in failed.</span>';
        hintEl.textContent = msg;
        googleBtn.disabled = false;
        googleBtn.innerHTML = GOOGLE_BTN_INNER;
      }
    }

    googleBtn.addEventListener('click', doSignIn);
  </script>
</body>
</html>
